<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的旅行準備清單 🌍</title>
    <style>
        :root {
            --primary-color: #3498db;
            --daily-color: #2ecc71;
            --transport-color: #f39c12;
            --special-color: #e74c3c;
            --ski-color: #34495e;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 { text-align: center; color: var(--ski-color); margin-bottom: 5px; font-size: 1.5em; }
        .subtitle { text-align: center; color: #888; font-size: 0.85em; margin-bottom: 20px; }

        .progress-wrapper {
            position: sticky;
            top: 0;
            background: var(--card-bg);
            padding: 10px 0;
            z-index: 10;
            border-bottom: 1px solid #eee;
        }
        .progress-container {
            background-color: #eee;
            border-radius: 20px;
            height: 10px;
            overflow: hidden;
        }
        .progress-bar {
            background: linear-gradient(90deg, #3498db, #2ecc71);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .category {
            margin: 20px 0 10px 0;
            padding: 8px 12px;
            background: #f1f3f5;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95em;
            display: flex;
            align-items: center;
        }

        .item {
            display: flex;
            align-items: flex-start;
            padding: 12px 10px;
            border-bottom: 1px solid #f1f1f1;
            cursor: pointer;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            margin-top: 3px;
        }

        input[type="checkbox"]:checked + .item-content span {
            text-decoration: line-through;
            color: #bbb;
        }

        .item-content { display: flex; flex-direction: column; flex: 1; }
        .item-title { font-size: 1em; }
        .item-desc { font-size: 0.8em; color: #777; margin-top: 2px; }

        .reset-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            background: #fff;
            color: #e74c3c;
            border: 1px solid #e74c3c;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌍 旅行準備清單</h1>
    <p class="subtitle">通用模組版 (適用各式旅遊)</p>

    <div class="progress-wrapper">
        <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
        <p style="text-align: center; font-size: 0.8em; margin: 8px 0;" id="progressText">0% 完成</p>
    </div>

    <div id="checklist">
        <div class="category" style="color: var(--daily-color);">🪪 核心證件與財務</div>
        <label class="item"><input type="checkbox" id="g_passport"><div class="item-content"><span class="item-title">護照與簽證</span><span class="item-desc">確認效期 6 個月以上、電子簽或紙本</span></div></label>
        <label class="item"><input type="checkbox" id="g_money"><div class="item-content"><span class="item-title">外幣現金與信用卡</span><span class="item-desc">備用信用卡、當地小額現金</span></div></label>
        <label class="item"><input type="checkbox" id="g_insurance"><div class="item-content"><span class="item-title">旅遊保險證明</span><span class="item-desc">包含海外醫療、特殊運動保障</span></div></label>

        <div class="category" style="color: var(--transport-color);">🚄 交通與行程預定</div>
        <label class="item"><input type="checkbox" id="g_airport"><div class="item-content"><span class="item-title">機場往返交通</span><span class="item-desc">Skyliner/接駁車/機場快線等</span></div></label>
        <label class="item"><input type="checkbox" id="g_longdist"><div class="item-content"><span class="item-title">跨城市交通票券</span><span class="item-desc">新幹線/高鐵/租車預訂</span></div></label>
        <label class="item"><input type="checkbox" id="g_web_entry"><div class="item-content"><span class="item-title">各國入境申報</span><span class="item-desc">如 Visit Japan Web / K-ETA / SG Arrival 等</span></div></label>

        <div class="category" style="color: var(--primary-color);">📱 電子設備與個人品</div>
        <label class="item"><input type="checkbox" id="g_net"><div class="item-content"><span class="item-title">網路連線方式</span><span class="item-desc">SIM卡 / eSIM / 分享器</span></div></label>
        <label class="item"><input type="checkbox" id="g_power"><div class="item-content"><span class="item-title">電力組</span><span class="item-desc">行動電源、轉接頭、各類充電線</span></div></label>
        <label class="item"><input type="checkbox" id="g_med"><div class="item-content"><span class="item-title">個人常備藥與清潔</span><span class="item-desc">感冒藥、止痛藥、保養品、牙刷組</span></div></label>

        <div class="category" style="color: var(--ski-color);">🎿 滑雪/極限運動專區</div>
        <label class="item"><input type="checkbox" id="s_safety"><div class="item-content"><span class="item-title">安全護具</span><span class="item-desc">安全帽、雪鏡、護膝、護具</span></div></label>
        <label class="item"><input type="checkbox" id="s_outer"><div class="item-content"><span class="item-title">外層功能衣物</span><span class="item-desc">防水雪衣雪褲、防水防寒手套</span></div></label>
        <label class="item"><input type="checkbox" id="s_ticket"><div class="item-content"><span class="item-title">活動票券</span><span class="item-desc">雪票預約、課程預約、器材租借確認</span></div></label>
        <label class="item"><input type="checkbox" id="s_skin"><div class="item-content"><span class="item-title">特殊護理</span><span class="item-desc">高強效防曬、厚長襪、圍脖/面罩</span></div></label>
    </div>

    <button class="reset-btn" onclick="resetList()">清除所有勾選</button>
</div>

<script>
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    function loadState() {
        checkboxes.forEach(box => {
            const isChecked = localStorage.getItem(box.id) === 'true';
            box.checked = isChecked;
        });
        updateProgress();
    }

    checkboxes.forEach(box => {
        box.addEventListener('change', () => {
            localStorage.setItem(box.id, box.checked);
            updateProgress();
        });
    });

    function updateProgress() {
        const total = checkboxes.length;
        const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
        const percent = Math.round((checked / total) * 100);
        progressBar.style.width = percent + '%';
        progressText.innerText = `${percent}% 完成 (${checked}/${total})`;
    }

    function resetList() {
        if(confirm("確定要重置所有勾選嗎？")) {
            checkboxes.forEach(box => {
                box.checked = false;
                localStorage.removeItem(box.id);
            });
            updateProgress();
        }
    }
    loadState();
</script>

</body>
</html>
