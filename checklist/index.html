<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行清單</title>
    <style>
        :root {
            --primary-color: #3498db;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            color: var(--text-main);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5em;
            color: var(--primary-color);
        }

        /* 置頂進度條 */
        .sticky-progress {
            position: sticky;
            top: 0;
            background: var(--card-bg);
            padding: 10px 0;
            z-index: 10;
            border-bottom: 1px solid #eee;
        }

        .progress-bar-bg {
            background-color: #eee;
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #3498db, #2ecc71);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        /* 分類樣式 */
        .category-title {
            margin: 25px 0 10px 0;
            padding: 8px 12px;
            background: #f1f3f5;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95em;
            color: var(--text-main);
            border-left: 4px solid var(--primary-color);
        }

        /* 項目樣式 */
        .item-row {
            display: flex;
            align-items: flex-start;
            padding: 12px 10px;
            border-bottom: 1px solid #f1f1f1;
            cursor: pointer;
        }

        .item-row input {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            margin-top: 3px;
        }

        .item-content {
            flex: 1;
        }

        .item-label {
            font-size: 1em;
            display: block;
        }

        .item-desc {
            font-size: 0.8em;
            color: #777;
            margin-top: 2px;
        }

        input:checked+.item-content .item-label {
            text-decoration: line-through;
            color: #bbb;
        }

        .reset-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            background: #fff;
            color: #e74c3c;
            border: 1px solid #e74c3c;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Tabs */
        .tabs {
            display: flex;
            margin-bottom: 20px;
            background: #f1f3f5;
            padding: 5px;
            border-radius: 12px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            color: #7f8c8d;
            transition: all 0.3s;
        }

        .tab.active {
            background: #fff;
            color: var(--primary-color);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        /* Timeline Styles */
        .timeline-container {
            display: none;
            /* Hidden by default */
            padding: 10px 0;
        }

        .timeline-date {
            background: #e3f2fd;
            color: #1976d2;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            margin: 20px 0 15px 0;
            font-size: 0.9em;
        }

        .timeline-item {
            position: relative;
            padding-left: 30px;
            margin-bottom: 25px;
            border-left: 2px solid #ddd;
            margin-left: 10px;
        }

        .timeline-item:last-child {
            border-left: 2px solid transparent;
        }

        .timeline-dot {
            position: absolute;
            left: -11px;
            top: 0;
            width: 20px;
            height: 20px;
            background: #fff;
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            z-index: 1;
        }

        .timeline-time {
            font-size: 0.85em;
            color: #7f8c8d;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .timeline-content {
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid #eee;
        }

        .timeline-title {
            font-weight: bold;
            font-size: 1em;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .timeline-desc {
            font-size: 0.85em;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="container">
        <a href="../index.html" style="display:inline-block; margin-bottom:10px; text-decoration:none; color:#666;">←
            回首頁</a>
        <div class="header">
            <h1 id="mainTitle">Loading...</h1>
            <p id="subTitle"></p>
        </div>
        <div class="sticky-progress">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <p id="progressText">0%</p>
        </div>

        <div class="tabs" id="mainTabs">
            <div class="tab active" onclick="switchTab('checklist')">準備清單</div>
            <div class="tab" onclick="switchTab('itinerary')">行程表</div>
        </div>

        <div id="checklistRenderRoot"></div>
        <div id="itineraryRenderRoot" class="timeline-container"></div>

        <div id="tripNotesSection" style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px;">
            <h3>📝 旅行筆記</h3>
            <textarea id="tripNotes"
                style="width: 100%; height: 150px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit;"
                placeholder="記錄旅途中的點點滴滴..."></textarea>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 30px;">
            <button class="reset-btn" onclick="resetChecklist()"
                style="margin-top: 0; flex: 1; background: #fff; color: #e74c3c; border: 1px solid #e74c3c;">重置勾選</button>
            <button class="reset-btn" onclick="toggleTripStatus()" id="statusBtn"
                style="margin-top: 0; flex: 1; background: #2ecc71; color: white; border: 1px solid #2ecc71;">完成旅行</button>
        </div>
    </div>

    <script>
        let currentTripId = null;

        // 核心邏輯：從外部檔案讀取資料
        async function init() {
            try {
                // 1. 解析 URL 參數
                const urlParams = new URLSearchParams(window.location.search);
                const mode = urlParams.get('mode');
                const tripId = urlParams.get('tripId');

                let config;

                if (mode === 'universal') {
                    currentTripId = 'universal';
                    const templateResponse = await fetch('../data/templates/universal.json');
                    config = await templateResponse.json();

                    // Universal Mode UI Adjustments
                    document.getElementById('tripNotesSection').style.display = 'none';
                    document.getElementById('statusBtn').style.display = 'none';
                } else {
                    if (!tripId) {
                        alert("未指定行程 ID");
                        window.location.href = '../index.html';
                        return;
                    }
                    currentTripId = tripId;

                    // 2. 讀取行程總表，找出對應的 template
                    const tripsResponse = await fetch('../data/trips.json');
                    const trips = await tripsResponse.json();
                    const trip = trips.find(t => t.id === tripId);

                    if (!trip) {
                        throw new Error("找不到此行程");
                    }

                    // 3. 讀取 Template
                    const templateResponse = await fetch(`../data/templates/${trip.template}`);
                    config = await templateResponse.json();

                    // 覆蓋標題為行程標題
                    config.subtitle = config.title;
                    config.title = trip.title;

                    // Load Itinerary if exists
                    if (trip.itinerary) {
                        loadItinerary(trip.itinerary);
                    } else {
                        document.getElementById('mainTabs').style.display = 'none'; // Hide tabs if no itinerary
                    }
                }

                // --- 新增排序邏輯 ---
                if (config.categories) {
                    config.categories.sort((a, b) => {
                        const sortA = a.sort !== undefined ? a.sort : 999;
                        const sortB = b.sort !== undefined ? b.sort : 999;
                        return sortA - sortB;
                    });
                }

                renderChecklist(config);
            } catch (error) {
                console.error("無法讀取設定檔:", error);
                document.getElementById('mainTitle').innerText = "載入失敗";
                document.getElementById('subTitle').innerText = error.message;
            }
        }

        async function loadItinerary(filename) {
            try {
                const response = await fetch(`../data/itineraries/${filename}`);
                const days = await response.json();
                const root = document.getElementById('itineraryRenderRoot');
                root.innerHTML = '';

                days.forEach(day => {
                    const dayHeader = document.createElement('div');
                    dayHeader.className = 'timeline-date';
                    dayHeader.innerText = day.date;
                    root.appendChild(dayHeader);

                    day.events.forEach(event => {
                        const item = document.createElement('div');
                        item.className = 'timeline-item';
                        item.innerHTML = `
                        <div class="timeline-dot">${event.icon || '•'}</div>
                        <div class="timeline-time">${event.time}</div>
                        <div class="timeline-content">
                            <div class="timeline-title">${event.title}</div>
                            ${event.desc ? `<div class="timeline-desc">${event.desc}</div>` : ''}
                        </div>
                    `;
                        root.appendChild(item);
                    });
                });
            } catch (e) {
                console.error("Failed to load itinerary", e);
                document.getElementById('itineraryRenderRoot').innerHTML = '<p style="text-align:center; color:#999;">無法載入行程表</p>';
            }
        }

        function switchTab(tabName) {
            const checklistRoot = document.getElementById('checklistRenderRoot');
            const itineraryRoot = document.getElementById('itineraryRenderRoot');
            const tabs = document.querySelectorAll('.tab');

            tabs.forEach(t => t.classList.remove('active'));

            if (tabName === 'checklist') {
                checklistRoot.style.display = 'block';
                itineraryRoot.style.display = 'none';
                tabs[0].classList.add('active');
                // Show notes and buttons
                document.getElementById('tripNotesSection').style.display = 'block';
                document.getElementById('statusBtn').parentElement.style.display = 'flex';
            } else {
                checklistRoot.style.display = 'none';
                itineraryRoot.style.display = 'block';
                tabs[1].classList.add('active');
                // Hide notes and buttons in itinerary view
                document.getElementById('tripNotesSection').style.display = 'none';
                document.getElementById('statusBtn').parentElement.style.display = 'none';
            }
        }

        function renderChecklist(config) {
            document.getElementById('mainTitle').innerText = config.title;
            document.getElementById('subTitle').innerText = config.subtitle;

            const root = document.getElementById('checklistRenderRoot');
            root.innerHTML = '';

            config.categories.forEach(cat => {
                const catDiv = document.createElement('div');
                catDiv.innerHTML = `<div class="category-title">${cat.name}</div>`;

                cat.items.forEach(item => {
                    const itemRow = document.createElement('label');
                    itemRow.className = 'item-row';
                    itemRow.innerHTML = `
                    <input type="checkbox" id="${item.id}" onchange="updateState('${item.id}', this.checked)">
                    <div class="item-content">
                        <span class="item-label">${item.label}</span>
                        ${item.desc ? `<span class="item-desc">${item.desc}</span>` : ''}
                    </div>
                `;
                    catDiv.appendChild(itemRow);
                });
                root.appendChild(catDiv);
            });

            loadSavedState();
            loadNotes();
            updateStatusUI();
        }

        function getStorageKey(itemId) {
            return `trip_${currentTripId}_chk_${itemId}`;
        }

        function updateState(id, isChecked) {
            localStorage.setItem(getStorageKey(id), isChecked);
            calculateProgress();
        }

        function loadSavedState() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(box => {
                const saved = localStorage.getItem(getStorageKey(box.id));
                if (saved === 'true') box.checked = true;
            });
            calculateProgress();
        }

        // --- Notes Logic ---
        const notesArea = document.getElementById('tripNotes');
        notesArea.addEventListener('input', (e) => {
            localStorage.setItem(`trip_${currentTripId}_notes`, e.target.value);
        });

        function loadNotes() {
            const savedNotes = localStorage.getItem(`trip_${currentTripId}_notes`);
            if (savedNotes) {
                notesArea.value = savedNotes;
            }
        }

        // --- Status Logic ---
        function toggleTripStatus() {
            const currentStatus = localStorage.getItem(`trip_status_${currentTripId}`);
            const newStatus = currentStatus === 'completed' ? 'planning' : 'completed';

            if (newStatus === 'completed') {
                if (!confirm("確定要將此旅行標記為「已完成」嗎？\n這將會把它移至「精彩回憶」區。")) return;
            }

            localStorage.setItem(`trip_status_${currentTripId}`, newStatus);
            updateStatusUI();
            alert(newStatus === 'completed' ? "旅行已完成！" : "旅行已恢復為規劃中。");
        }

        function updateStatusUI() {
            const status = localStorage.getItem(`trip_status_${currentTripId}`);
            const btn = document.getElementById('statusBtn');
            if (status === 'completed') {
                btn.innerText = "恢復為規劃中";
                btn.style.background = "#95a5a6";
                btn.style.borderColor = "#95a5a6";
            } else {
                btn.innerText = "完成旅行";
                btn.style.background = "#2ecc71";
                btn.style.borderColor = "#2ecc71";
            }
        }

        function calculateProgress() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            const total = checkboxes.length;
            const checked = Array.from(checkboxes).filter(b => b.checked).length;
            const percent = total === 0 ? 0 : Math.round((checked / total) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').innerText = `${percent}% 完成 (${checked}/${total})`;
        }

        function resetChecklist() {
            if (confirm("確定要重置此行程的所有勾選嗎？")) {
                // 僅清除此行程的 key
                const checkboxes = document.querySelectorAll('input[type="checkbox"]');
                checkboxes.forEach(box => {
                    localStorage.removeItem(getStorageKey(box.id));
                });
                location.reload();
            }
        }

        init(); // 啟動
    </script>
</body>

</html>
