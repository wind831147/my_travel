<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>越後湯澤滑雪清單 ❄️</title>
    <style>
        :root {
            --primary-color: #3498db;
            --ski-color: #2c3e50;
            --ticket-color: #27ae60;
            --transport-color: #e67e22;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 { text-align: center; color: var(--ski-color); margin-bottom: 5px; }
        .subtitle { text-align: center; color: #888; font-size: 0.9em; margin-bottom: 20px; }

        .progress-wrapper {
            position: sticky;
            top: 0;
            background: var(--card-bg);
            padding: 10px 0;
            z-index: 10;
        }
        .progress-container {
            background-color: #eee;
            border-radius: 20px;
            height: 12px;
            overflow: hidden;
        }
        .progress-bar {
            background: linear-gradient(90deg, #3498db, #2ecc71);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .category {
            margin: 25px 0 10px 0;
            padding: 5px 12px;
            background: #f1f3f5;
            border-radius: 8px;
            font-weight: bold;
            color: var(--ski-color);
        }

        .item {
            display: flex;
            align-items: flex-start;
            padding: 14px 10px;
            border-bottom: 1px solid #f1f1f1;
            cursor: pointer;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            margin-top: 2px;
        }

        input[type="checkbox"]:checked + .item-content span {
            text-decoration: line-through;
            color: #bbb;
        }

        .item-content { display: flex; flex-direction: column; }
        .item-desc { font-size: 0.75em; color: #666; margin-top: 4px; }

        .link-tag {
            font-size: 0.7em;
            color: var(--primary-color);
            text-decoration: none;
            margin-top: 4px;
        }

        .reset-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            background: #fff;
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>❄️ 越後湯澤滑雪清單</h1>
    <p class="subtitle">岩原．神立．神樂攻略</p>

    <div class="progress-wrapper">
        <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
        <p style="text-align: center; font-size: 0.85em; margin: 8px 0;" id="progressText">載入中...</p>
    </div>

    <div id="checklist">
        <div class="category" style="color: var(--ticket-color);">🎟️ 雪票與預約</div>
        
        <label class="item">
            <input type="checkbox" id="tk_iwanappara">
            <div class="item-content">
                <span>岩原 (Iwappara) 雪票</span>
                <span class="item-desc">適合新手、超寬廣平坦坡道</span>
                <a href="https://iwanappara.com/" target="_blank" class="link-tag">🌐 官網連結</a>
            </div>
        </label>

        <label class="item">
            <input type="checkbox" id="tk_kandatsu">
            <div class="item-content">
                <span>神立 (Kandatsu) 雪票</span>
                <span class="item-desc">適合年輕人、公園(Park)設施多、有夜滑</span>
                <a href="https://www.kandatsu.com/" target="_blank" class="link-tag">🌐 官網連結</a>
            </div>
        </label>

        <label class="item">
            <input type="checkbox" id="tk_kagura">
            <div class="item-content">
                <span>神樂 (Kagura) 雪票</span>
                <span class="item-desc">海拔高雪質好、春天也能滑、纜車超長</span>
                <a href="https://www.princehotels.co.jp/ski/kagura/" target="_blank" class="link-tag">🌐 官網連結</a>
            </div>
        </label>

        <div class="category" style="color: var(--transport-color);">🚄 交通票券</div>
        <label class="item"><input type="checkbox" id="t_skyliner"><span>Skyliner 預約</span></label>
        <label class="item"><input type="checkbox" id="t_shinkansen"><span>新幹線 / JR Pass 劃位</span></label>
        <label class="item"><input type="checkbox" id="t_shuttle"><span>確認雪場接駁車時間</span></label>

        <div class="category">🎿 滑雪裝備</div>
        <label class="item"><input type="checkbox" id="s_h"><span>安全帽 / 雪鏡</span></label>
        <label class="item"><input type="checkbox" id="s_c"><span>雪衣 / 雪褲 / 內搭</span></label>
        <label class="item"><input type="checkbox" id="s_p"><span>護具 (防摔褲/護膝/護肘)</span></label>
        <label class="item"><input type="checkbox" id="s_s"><span>滑雪長襪 / 防水手套</span></label>
    </div>

    <button class="reset-btn" onclick="resetList()">清除所有勾選</button>
</div>

<script>
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    function loadState() {
        checkboxes.forEach(box => {
            const isChecked = localStorage.getItem(box.id) === 'true';
            box.checked = isChecked;
        });
        updateProgress();
    }

    checkboxes.forEach(box => {
        box.addEventListener('change', (e) => {
            localStorage.setItem(box.id, box.checked);
            updateProgress();
        });
    });

    function updateProgress() {
        const total = checkboxes.length;
        const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
        const percent = Math.round((checked / total) * 100);
        progressBar.style.width = percent + '%';
        progressText.innerText = `${percent}% 完成 (${checked}/${total})`;
    }

    function resetList() {
        if(confirm("確定要重置嗎？")) {
            checkboxes.forEach(box => {
                box.checked = false;
                localStorage.removeItem(box.id);
            });
            updateProgress();
        }
    }
    loadState();
</script>

</body>
</html>
