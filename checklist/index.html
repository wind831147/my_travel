<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行清單</title>
    <style>
        :root {
            --primary-color: #3498db;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            color: var(--text-main);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 1.5em; color: var(--primary-color); }

        /* 置頂進度條 */
        .sticky-progress {
            position: sticky;
            top: 0;
            background: var(--card-bg);
            padding: 10px 0;
            z-index: 10;
            border-bottom: 1px solid #eee;
        }
        .progress-bar-bg {
            background-color: #eee;
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #3498db, #2ecc71);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        /* 分類樣式 */
        .category-title {
            margin: 25px 0 10px 0;
            padding: 8px 12px;
            background: #f1f3f5;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95em;
            color: var(--text-main);
            border-left: 4px solid var(--primary-color);
        }

        /* 項目樣式 */
        .item-row {
            display: flex;
            align-items: flex-start;
            padding: 12px 10px;
            border-bottom: 1px solid #f1f1f1;
            cursor: pointer;
        }
        .item-row input {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            margin-top: 3px;
        }
        .item-content { flex: 1; }
        .item-label { font-size: 1em; display: block; }
        .item-desc { font-size: 0.8em; color: #777; margin-top: 2px; }

        input:checked + .item-content .item-label {
            text-decoration: line-through;
            color: #bbb;
        }

        .reset-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            background: #fff;
            color: #e74c3c;
            border: 1px solid #e74c3c;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="mainTitle">Loading...</h1>
        <p id="subTitle"></p>
    </div>
    <div class="sticky-progress">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
        <p id="progressText">0%</p>
    </div>
    <div id="checklistRenderRoot"></div>
    <button class="reset-btn" onclick="resetChecklist()">重置所有勾選</button>
</div>

<script>
    // 核心邏輯：從外部檔案讀取資料
    async function init() {
        try {
            // 讀取同目錄下的 config.json
            const response = await fetch('./config.json');
            const config = await response.json();

            // --- 新增排序邏輯 ---
            if (config.categories) {
                config.categories.sort((a, b) => {
                    // 如果沒有定義 sort，預設放最後面 (999)
                    const sortA = a.sort !== undefined ? a.sort : 999;
                    const sortB = b.sort !== undefined ? b.sort : 999;
                    return sortA - sortB;
                });
            }
            
            renderChecklist(config);
        } catch (error) {
            console.error("無法讀取設定檔:", error);
            document.getElementById('mainTitle').innerText = "載入失敗，請檢查 config.json";
        }
    }

    function renderChecklist(config) {
        document.getElementById('mainTitle').innerText = config.title;
        document.getElementById('subTitle').innerText = config.subtitle;
        
        const root = document.getElementById('checklistRenderRoot');
        root.innerHTML = '';

        config.categories.forEach(cat => {
            const catDiv = document.createElement('div');
            catDiv.innerHTML = `<div class="category-title">${cat.name}</div>`;
            
            cat.items.forEach(item => {
                const itemRow = document.createElement('label');
                itemRow.className = 'item-row';
                itemRow.innerHTML = `
                    <input type="checkbox" id="${item.id}" onchange="updateState('${item.id}', this.checked)">
                    <div class="item-content">
                        <span class="item-label">${item.label}</span>
                        ${item.desc ? `<span class="item-desc">${item.desc}</span>` : ''}
                    </div>
                `;
                catDiv.appendChild(itemRow);
            });
            root.appendChild(catDiv);
        });
        loadSavedState();
    }

    // 儲存、讀取與進度計算邏輯保持不變...
    function updateState(id, isChecked) {
        localStorage.setItem('trip_chk_' + id, isChecked);
        calculateProgress();
    }

    function loadSavedState() {
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach(box => {
            const saved = localStorage.getItem('trip_chk_' + box.id);
            if (saved === 'true') box.checked = true;
        });
        calculateProgress();
    }

    function calculateProgress() {
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        const total = checkboxes.length;
        const checked = Array.from(checkboxes).filter(b => b.checked).length;
        const percent = total === 0 ? 0 : Math.round((checked / total) * 100);
        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById('progressText').innerText = `${percent}% 完成 (${checked}/${total})`;
    }

    function resetChecklist() {
        if(confirm("確定要重置嗎？")) {
            localStorage.clear(); // 簡化處理
            location.reload();
        }
    }

    init(); // 啟動
</script>
</body>
</html>
